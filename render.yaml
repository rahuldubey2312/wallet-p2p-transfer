# Render blueprint: one web service on the free plan plus a free managed
# Postgres. Import this file from the Render dashboard (Blueprints -> New) and
# both are provisioned wired together, with no dashboard fields to fill in by
# hand and nothing to mistype.
services:
  - type: web
    name: wallet-service
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # Render hands out a postgres:// URL, which JDBC cannot consume
      # directly. DatabaseUrlEnvironmentPostProcessor translates DATABASE_URL
      # into the jdbc: form plus credentials at startup.
      - key: DATABASE_URL
        fromDatabase:
          name: wallet-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "8"
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError

databases:
  - name: wallet-db
    plan: free
    databaseName: wallet
    user: wallet
